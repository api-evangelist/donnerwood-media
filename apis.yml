name: Donnerwood Media
description: Donnerwood Media was an early-stage social gaming and social entertainment company founded
  in 2005 by Sean Ryan and based in San Francisco. It operated Meez.com, an avatar-building platform that
  let consumers create customized 3D avatars usable across the web as personal identifiers, alongside a
  portfolio of social game properties. The company raised roughly $15.7M from Battery Ventures, transcosmos,
  and Allen & Company. It is now defunct — the Meez service went offline in December 2017 and its domain
  expired in March 2018 — so it exposes no live website, developer portal, or API surface.
